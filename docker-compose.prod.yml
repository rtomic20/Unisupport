services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unisupport
      POSTGRES_USER: unisupport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisupport"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_initial_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://unisupport:${POSTGRES_PASSWORD}@db:5432/unisupport
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      CORS_ALLOWED_ORIGINS: "http://${SERVER_IP}:4200"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.railway
      args:
        VITE_API_URL: http://${SERVER_IP}:8000/api
    ports:
      - "4200:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
