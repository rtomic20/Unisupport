services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unisupport}
      POSTGRES_USER: ${POSTGRES_USER:-unisupport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unisupport_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unisupport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: python entrypoint.py
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-unisupport}:${POSTGRES_PASSWORD:-unisupport_dev}@db:5432/${POSTGRES_DB:-unisupport}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG: "True"

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api

volumes:
  pgdata:
